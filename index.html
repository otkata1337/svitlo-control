Фулл гайд: Как заменить файлы SvitloControl на чистое приложение

Шаг 1: Подготовка папки

1. Закройте браузер, если открыт index.html из SvitloControl
2. Откройте папку C:\games\SvitloControl в Проводнике Windows
3. Сделайте бэкап (на всякий случай):
   - Нажмите Ctrl + A (выделить все)
   - Ctrl + C (скопировать)
   - Вставьте в папку D:\Backup\SvitloControl_backup или просто переименуйте папку в SvitloControl_orig

Шаг 2: Удаление старых файлов

4. Удалите всё внутри папки C:\games\SvitloControl:
   - Нажмите Ctrl + A (выделить все файлы и папки)
   - Delete (или Ctrl + C → Del)
   - Или нажмите Shift + Delete для permanent удаления

Важно: оставьте пустую папку C:\games\SvitloControl

Шаг 3: Создание чистого приложения

Теперь у вас есть два варианта:

Вариант А: Создать новый файл index.html в той же папке

1. Нажмите Right click → New → Text Document
2. Назовите файл index.html (при расширении .html система спросит, уверены ли вы — нажмите Yes)
3. Откройте файл для редактирования (дважды кликните или Right edit)

Вариант Б: Создать новую папку

1. C:\games\SvitloClean\ (как обсуждали ранее)
2. Всю структуру перенести туда

    <script>
        // Конфігурація
        const API_URL = 'schedules_cache.json';
        const ALL_QUEUES = ['1.1','1.2','2.1','2.2','3.1','3.2','4.1','4.2','5.1','5.2','6.1','6.2'];

        let schedules = {};
        let selectedQueue = localStorage.getItem('svitlo_queue') || '1.1';

        // Елементи DOM
        const statusBadge = document.getElementById('status-badge');
        const statusSubtitle = document.getElementById('status-subtitle');
        const statusQueue = document.getElementById('status-queue');
        const timelineBar = document.querySelector('.grid.grid-cols-24');
        const outagesList = document.getElementById('outages-list');
        const queuesGrid = document.getElementById('queues');

        // Рендеринг таймлайну
        function renderTimeline(intervals) {
            if (!timelineBar) return;
            timelineBar.innerHTML = '';

            for (let h = 0; h < 24; h++) {
                for (let q = 0; q < 4; q++) {
                    const slotIndex = h * 4 + q;
                    let isOff = false;

                    for (const [sH, sM, eH, eM] of intervals) {
                        const slotStart = sH * 60 + sM;
                        const slotEnd = eH * 60 + eM;
                        const checkMin = h * 60 + q * 15;

                        if (checkMin >= slotStart && checkMin < slotEn
                            isOff = true;
                            break;
                        }
                    }

                    const slot = document.createElement('div');
                    slot.className = `col-span-1 timeline-slot ${isOff ? 'off' : 'on'}`;
                    timelineBar.appendChild(slot);
                }
            }
        }

        // Рендеринг черг
        function renderQueues(todayData) {
            if (!queuesGrid) return;
            queuesGrid.innerHTML = '';

            ALL_QUEUES.forEach(q => {
                const intervals = (todayData && todayData[q]) || [];
                const isActive = q === selectedQueue;

                let isOff = false;
                const now = new Date();
                const currentMin = now.getHours() * 60 + now.getMinutes();
                for (const [sH, sM, eH, eM] of intervals) {
                    if (currentMin >= sH * 60 + sM && currentMin < eH
                        isOff = true;
                        break;
                    }
                }

                const badge = document.createElement('div');
                badge.className = `queue-badge ${isActive ? 'active' : ''} ${isOff ? 'off' : 'on'}`;
                badge.textContent = q;
                badge.title = `${intervals.length} подій`;

                badge.onclick = () => {
                    selectedQueue = q;
                    localStorage.setItem('svitlo_queue', q);
                    render();
                };

                queuesGrid.appendChild(badge);
            });
        }

        // Рендеринг виключень
        function renderOutages(intervals) {
            if (!outagesList) return;
            outagesList.innerHTML = '';

            if (!intervals.length) {
                outagesList.innerHTML = '<div class="text-center text-slate-500 py-8">Сьогодні без перерв</div>';
                return;
            }

            intervals.forEach(([sH, sM, eH, eM]) => {
                const duration = (eH * 60 + eM) - (sH * 60 + sM);
                const hours = Math.floor(duration / 60);
                const mins = duration % 60;

                const item = document.createElement('div');
                item.className = 'outage-item';
                item.innerHTML = `
                    <span class="outage-time">${String(sH).padStart(2,'0')}:${String(sM).padStart(2,'0')} —
${String(eH).padStart(2,'0')}:${String(eM).padStart(2,'0')}</span>
                    <span class="outage-duration">${hours}г ${mins}хв</span>
                `;
                outagesList.appendChild(item);
            });
        }

        // Основний рендеринг
        function render() {
            fetch(API_URL)
                .then(r => r.ok ? r.json() : { error: true })
                .then(data => {
                    schedules = data || {};
                    localStorage.setItem('svitlo_cache', JSON.stringify(schedules));
                    localStorage.setItem('svitlo_cache_timestamp', new Date().toISOString());
                    localStorage.setItem('svitlo_lastError', '');

                    if (Object.keys(schedules).length > 0) {
                        const todayData = schedules[new Date().toISOString().split('T')[0]] || {};
                        const intervals = todayData[selectedQueue] ||

                        const off = intervals.some(([sH, sM, eH, eM]) => {
                            const now = new Date();
                            const totalMinutes = now.getHours() * 60 + now.getMinutes();
                            return totalMinutes >= sH * 60 + sM && totalMinutes < eH * 60 + eM;
                        });
                        if (statusBadge) {
                            statusBadge.className = `status-pill ${off ? 'off' : 'on'}`;
                            statusBadge.textContent = off ? 'СВІТЛО ВІ
                        }
                        if (statusSubtitle) {
                            const next = intervals.filter(([sH, sM, eH, eM]) => sH * 60 + sM > new Date().getHours() * 60 + new Date().getMinutes()).sort((a, b) =>
a[0]*60+a[1] - (b[0]*60+b[1]))[0];
                            if (next) {
                                statusSubtitle.textContent = `Наступне о ${String(next[0]).padStart(2,'0')}:${String(next[1]).padStart(2,'0')}`;
                            } else {
                                statusSubtitle.textContent = 'Сьогодні без перерв';
                            }
                        }
                        if (statusQueue) statusQueue.textContent = sel

                        renderTimeline(intervals);
                        renderOutages(intervals);
                        renderQueues(todayData);
                    } else {
                        if (statusBadge) {
                            statusBadge.className = 'status-pill on';
                            statusBadge.textContent = 'Світло є';
                        }
                        if (statusSubtitle) statusSubtitle.textContent
                        if (statusQueue) statusQueue.textContent = '1.1';
                        renderTimeline([]);
                        renderOutages([]);
                        renderQueues({});
                    }
                })
                .catch(e => {
                    console.warn('Помилка:', e.message);
                    if (statusSubtitle) statusSubtitle.textContent = 'Помилка завантаження';
                    if (statusBadge) {
                        statusBadge.className = 'status-pill off';
                        statusBadge.textContent = 'Помилка';
                    }
                });
        }

        setInterval(render, 60000);
        setInterval(() => {
            fetch(API_URL, { cache: 'no-cache' }).then(r => r.ok && r.json()).then(data => {
                schedules = data || {};
                render();
            });
        }, 300000);

        render();
    </script>
