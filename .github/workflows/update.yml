name: Auto Update Svitlo Schedules

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час
  workflow_dispatch: # Возможность запустить вручную из интерфейса GitHub

jobs:
  update-schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 aiohttp

      - name: Run schedule updater / parser
        run: |
          python updater.py

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedules_cache.json
          git diff --staged --quiet || (git commit -m "chore: auto-update schedules [skip ci]" && git push)
