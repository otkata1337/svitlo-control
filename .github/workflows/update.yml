name: Auto Update Svitlo Schedules

on:
  schedule:
    - cron: '0 */2 * * *' # Запуск кожні 2 години (зменшено навантаження)
  workflow_dispatch: # Можливість запустити вручну

jobs:
  update-schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run schedule updater v4
        run: node updater.js
        env:
          TZ: 'Europe/Kyiv'

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedules_cache.json
          git diff --staged --quiet || (git commit -m "chore: auto-update schedules [skip ci]" && git push)
